packages:
  - apps/*/*
  - vendor/packages/*
  - vendor/configs/*
  - '!**/test/**'

enableGlobalVirtualStore: true

# Storybook 10 dynamically `import()`s the framework + addons by name from its own dist code.
# Under enableGlobalVirtualStore, storybook's realpath sits outside the project tree, so the
# walk-up never reaches the project root and these can't be resolved. Listing them as optional
# peers makes pnpm symlink them as siblings of storybook in its virtual-store node_modules.
packageExtensions:
  storybook:
    peerDependencies:
      '@storybook/react-vite': '*'
      '@storybook/addon-docs': '*'
      '@storybook/addon-links': '*'
    peerDependenciesMeta:
      '@storybook/react-vite': { optional: true }
      '@storybook/addon-docs': { optional: true }
      '@storybook/addon-links': { optional: true }
  # langium (transitively from @wl/ai-chat-fe → streamdown → mermaid → @mermaid-js/parser) imports
  # vscode-languageserver-protocol and vscode-languageserver-types directly but only declares the
  # vscode-languageserver meta-package. Under enableGlobalVirtualStore those sub-packages sit in the CAS
  # without node_modules adjacency to langium; optional peers make pnpm symlink them next to it.
  langium:
    peerDependencies:
      vscode-jsonrpc: '*'
      vscode-languageserver-protocol: '*'
      vscode-languageserver-types: '*'
    peerDependenciesMeta:
      vscode-jsonrpc: { optional: true }
      vscode-languageserver-protocol: { optional: true }
      vscode-languageserver-types: { optional: true }

catalog:
  '@ag-ui/client': 1.0.5
  '@langchain/core': ^1.5.0
  '@langchain/langgraph': ^1.7.5
  '@playwright/test': ^1.59.1
  '@tailwindcss/vite': ^4.3.5

  '@tanstack/react-router': ^1.168.10
  '@tanstack/router-devtools': ^1.166.11
  '@tanstack/router-plugin': ^1.167.12
  '@tanstack/router-vite-plugin': 1.166.27
  '@types/aws-lambda': ^8.10.162
  '@types/jsonwebtoken': ^9.0.10
  '@types/node': ^26.6.10
  '@types/react': 19.3.1
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.3.0
  '@vitest/browser': ^5.1.1
  '@vitest/browser-playwright': ^5.1.1
  '@vitest/coverage-v8': ^5.1.1
  '@vitest/ui': ^5.1.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  date-fns: ^4.1.0

  jotai: 3.0.2
  jsonwebtoken: ^9.0.3
  lucide-react: ^1.78.0
  playwright: ^1.65.1
  react: 19.3.1
  react-dom: 19.3.1
  rollup-plugin-visualizer: ^7.0.0
  rxjs: 7.8.1
  sass-embedded: ^1.99.0
  streamdown: 1.6.11
  tailwind-merge: ^3.7.0

  tailwindcss: ^4.3.5
  tw-animate-css: ^1.4.0

  typescript: ^6.0.3
  typescript-plugin-css-modules: ^5.3.1

  vite: 8.3.8
  vite-plugin-dts: ^5.1.2
  vitest: ^5.1.1
  vitest-browser-react: ^2.3.0
  vite-tsconfig-paths: ^6.1.1
  zod: 3.25.76
  zod-v4: npm:zod@4.5.4

catalogs:
  # @copilotkit/* must be exact AND identical on both sides of the wire (react-core in
  # @wl/ai-chat-fe, runtime in @wl/ai-chat-be) — version skew drops AG-UI events silently.
  copilotkit:
    '@copilotkit/a2ui-renderer': 1.90.2
    '@copilotkit/react-core': 1.90.2
    '@copilotkit/runtime': 1.90.2
  # The zod that @ag-ui/client and @ag-ui/core take as a peer, on both sides of the wire. @copilotkit/core
  # and @copilotkit/runtime depend on zod 3 themselves; a package offering zod 4 got a second AG-UI
  # instance, and two AbstractAgent classes do not type-check against each other (private `_threadId`).
  agui:
    zod: 3.25.76

overrides:
  # One CopilotKit core: @copilotkit/runtime depends on @copilotkit/channels-* 0.13.0, which take
  # @copilotkit/core and shared as `^1.90.1`, so the next CopilotKit release would land beside the catalog
  # pin. Move these with the catalog.
  '@copilotkit/core': 1.90.2
  '@copilotkit/shared': 1.90.2
  # One copy of the LangGraph family: @ag-ui/langgraph (via @copilotkit/runtime) asks for `langchain >=1.2.0`
  # with no ceiling, and langchain 1.4.x resolves an older @langchain/langgraph than @wl/ai-chat-be's.
  # Bump them with the family, to the newest 1.x whose ranges accept the pins.
  langchain: 1.6.7
  '@langchain/langgraph': 1.7.5
  '@langchain/langgraph-checkpoint': 1.2.3
  '@langchain/langgraph-sdk': 1.17.0
  '@langchain/protocol': 0.0.21
  # @langchain/core and langsmith peer on openai, so each openai copy is another core instance.
  openai@>=7.0.0 <7.62.0: 7.62.0
  # One copy each: @copilotkit/runtime accepts @langchain/openai >=0.4.2 and @cfworker/json-schema ^4.1.1
  # but keeps its older resolutions beside the ones @langchain/core 1.5 pulls.
  '@langchain/openai': 1.8.5
  '@cfworker/json-schema@>=4.0.0 <4.1.6': 4.1.6

supportedArchitectures:
  cpu:
    - arm64
  libc:
    - glibc
  os:
    - darwin
    - linux

strictPeerDependencies: false

publicHoistPattern:
  - '*types*'
  - '*eslint*'
  - '*prettier*'
  - '*stylelint*'
  - '*typescript*'
  - '*config*'
  - '@storybook*'
  - storybook*
  - '*@testing-library*'
  - '*@vitejs*'
  - '*vitest*'
  - '*@vitest*'

allowBuilds:
  '@parcel/watcher': true
  # CopilotKit's install-time telemetry: listed so pnpm stops warning, never run.
  '@scarf/scarf': false
  esbuild: true
  msw: true

minimumReleaseAgeExclude:
  - '@slip-stream-kit/*'
  - infra-kit
