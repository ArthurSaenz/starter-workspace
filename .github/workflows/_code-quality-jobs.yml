name: _code-quality-jobs

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      cache_version:
        required: true
        type: string
      visual:
        required: false
        type: string
        default: check

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # Baselines are per platform; recording them here keeps the Linux set identical to what qa compares.
      - name: Record screenshot baselines
        if: ${{ inputs.visual == 'update' }}
        run: pnpm --filter @wl/data-table exec vitest run src/__tests__/visual.test.tsx --update

      - name: Upload screenshot baselines
        if: ${{ inputs.visual == 'update' }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-screenshot-baselines
          path: '**/__screenshots__/**/*-linux.png'

      - name: Run QA
        run: pnpm run qa

      # Deliberately separate from qa — see "## .claude test suite" in CLAUDE.md.
      - name: Run .claude test suites
        run: pnpm run test:claude

      - name: Notify Slack of failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_MESSAGE: "Code quality for ${{ github.ref_name }} by ${{ github.actor }}"
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
