name: '07 ⚙️ Code quality'
run-name: '07 ⚙️ Code quality'

on:
  workflow_dispatch:
    inputs:
      visual:
        description: 'Vitest screenshot baselines: `check` compares, `update` re-records the Linux set and uploads it'
        type: choice
        options: [check, update]
        default: check

jobs:
  validate-cache:
    uses: ./.github/workflows/_cache-nodemodules-jobs.yml
    with:
      branch: ${{ github.ref }}
      cache_version: 1
    secrets: inherit

  code-quality:
    needs: [validate-cache]
    uses: ./.github/workflows/_code-quality-jobs.yml
    with:
      branch: ${{ github.ref }}
      cache_version: 1
      visual: ${{ inputs.visual }}
    secrets: inherit

  notify-success:
    needs: [code-quality]
    uses: ./.github/workflows/_notify-success-jobs.yml
    secrets: inherit
